name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile and package
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:|warning: \[mixin\]|Mixin|FAILED" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 120 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong" -A4 build.log | head -n 10 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Decompile reference classes
        if: always() && contains(github.event.head_commit.message, '[probe]')
        run: |
          mkdir -p decomp
          find ~/.gradle/caches -name '*.jar' | grep -iE 'forge-1.16.5|client|mapped|enhancedcelestials' > decomp/jars.txt || true
          curl -sSL -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          MC=$(grep -E 'forge-1.16.5-36.2.39_mapped_official_1.16.5(-recomp)?\.jar$' decomp/jars.txt | head -1)
          echo "MC jar: $MC" >> decomp/jars.txt
          while read -r cls; do
            [ -z "$cls" ] && continue
            java -jar cfr.jar "$MC" --jarfilter "^${cls}\$" --outputdir decomp >/dev/null 2>&1 || true
          done < tools/probe-classes.txt
          EC=$(grep -i enhancedcelestials decomp/jars.txt | grep -v sources | head -1)
          [ -n "$EC" ] && java -jar cfr.jar "$EC" --outputdir decomp/ec >/dev/null 2>&1 || true
          EXTRA=$(grep -E 'client.*extra.*\.jar$' decomp/jars.txt | head -1)
          echo "extra: $EXTRA" >> decomp/jars.txt
          mkdir -p decomp/data && (cd decomp/data && unzip -q -o "$EXTRA" 'data/minecraft/loot_tables/entities/*' 'data/minecraft/loot_tables/chests/*' 'data/minecraft/tags/blocks/*' 'data/minecraft/tags/items/*' || true)
          (cd decomp/data && unzip -q -o "$MC" 'data/forge/tags/*' || true)

      - name: Publish logs and probe output to the ci-logs branch
        if: always()
        run: |
          mkdir -p ci-out && cp build.log ci-out/ 2>/dev/null || true
          cp -r decomp ci-out/ 2>/dev/null || true
          cp run/logs/latest.log ci-out/server-latest.log 2>/dev/null || true
          cp selftest.log ci-out/ 2>/dev/null || true
          cd ci-out && git init -q && git checkout -q -b ci-logs
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI output for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs || true

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ecmoons-jar
          path: build/libs/*.jar
          if-no-files-found: error
