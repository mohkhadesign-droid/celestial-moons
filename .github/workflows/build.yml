name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-fg-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-fg-

      - name: Compile and package
        timeout-minutes: 20
        run: |
          chmod +x gradlew
          set -o pipefail
          timeout 1140 ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Dedicated server self test
        id: selftest
        timeout-minutes: 25
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf "online-mode=false\nspawn-protection=0\nlevel-seed=ecmoons\n" > run/server.properties
          set -o pipefail
          ECMOONS_SELFTEST=true timeout 1200 ./gradlew runServer --no-daemon 2>&1 | tee selftest-full.log || true
          grep -E "ECMOONS-SELFTEST|Mixin|mixin|ERROR|Exception|Caused by" selftest-full.log | grep -v "DEBUG" | head -n 600 > selftest.log || true
          tail -n 60 selftest-full.log >> selftest.log
          grep -q "SELFTEST COMPLETE passed=[0-9]* failed=0" selftest-full.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:|warning: \[mixin\]|Mixin|FAILED" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 120 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong" -A4 build.log | head -n 10 >> errors.txt || true
          grep -E "SELFTEST\] FAIL|SELFTEST COMPLETE" selftest-full.log 2>/dev/null | head -n 40 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Decompile reference classes
        if: always() && contains(github.event.head_commit.message, '[probe]')
        run: |
          mkdir -p decomp
          find ~/.gradle/caches -name '*.jar' | grep -iE 'forge-1.16.5|client|mapped|enhancedcelestials' > decomp/jars.txt || true
          curl -sSL -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          MC=$(grep -E 'forge-1.16.5-36.2.39_mapped_official_1.16.5(-recomp)?\.jar$' decomp/jars.txt | head -1)
          echo "MC jar: $MC" >> decomp/jars.txt
          while read -r cls; do
            [ -z "$cls" ] && continue
            java -jar cfr.jar "$MC" --jarfilter "^${cls}\$" --outputdir decomp >/dev/null 2>&1 || true
          done < tools/probe-classes.txt
          EC=$(grep -i enhancedcelestials decomp/jars.txt | grep -v sources | head -1)
          [ -n "$EC" ] && java -jar cfr.jar "$EC" --outputdir decomp/ec >/dev/null 2>&1 || true
          EXTRA=$(grep -E 'client.*extra.*\.jar$' decomp/jars.txt | head -1)
          echo "extra: $EXTRA" >> decomp/jars.txt
          mkdir -p decomp/data && (cd decomp/data && unzip -q -o "$EXTRA" 'data/minecraft/loot_tables/entities/*' 'data/minecraft/loot_tables/chests/*' 'data/minecraft/tags/blocks/*' 'data/minecraft/tags/items/*' || true)
          (cd decomp/data && unzip -q -o "$MC" 'data/forge/tags/*' || true)

      - name: Publish logs and probe output to the ci-logs branch
        if: always()
        run: |
          mkdir -p ci-out && cp build.log ci-out/ 2>/dev/null || true
          cp -r decomp ci-out/ 2>/dev/null || true
          cp run/logs/latest.log ci-out/server-latest.log 2>/dev/null || true
          cp selftest.log selftest-full.log ci-out/ 2>/dev/null || true
          mkdir -p ci-out/jar && cp build/libs/*.jar ci-out/jar/ 2>/dev/null || true
          find run/config -type f \( -name '*.toml' -o -name '*.json' \) -exec cp --parents {} ci-out/ \; 2>/dev/null || true
          cd ci-out && git init -q && git checkout -q -b ci-logs
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI output for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs || true

      - name: Upload mod jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecmoons-jar
          path: build/libs/*.jar
          if-no-files-found: warn

  client-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle and ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-fg-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-fg-

      - name: Install virtual display and software OpenGL
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb mesa-utils libgl1-mesa-dri

      - name: Client test (real Minecraft client, software rendering)
        timeout-minutes: 40
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          ECMOONS_CLIENTTEST: 'true'
        run: |
          chmod +x gradlew
          mkdir -p run-client
          printf "pauseOnLostFocus:false\ntutorialStep:none\nskipMultiplayerWarning:true\nrenderDistance:8\ngraphicsMode:1\nfov:0.0\njoinedFirstServer:true\nnarrator:0\nsoundCategory_master:0.0\n" > run-client/options.txt
          set -o pipefail
          timeout 2100 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient --no-daemon 2>&1 | tee client-full.log || true
          grep -E "ECMOONS-CLIENTTEST|Mixin|ERROR|Exception|Caused by|OpenGL|GL version" client-full.log | head -n 600 > client.log || true
          tail -n 80 client-full.log >> client.log
          grep -q "CLIENTTEST COMPLETE passed=[0-9]* failed=0" client-full.log

      - name: Publish client test output to the ci-client branch
        if: always()
        run: |
          mkdir -p ci-out && cp client.log client-full.log ci-out/ 2>/dev/null || true
          cp -r run-client/screenshots ci-out/ 2>/dev/null || true
          cp run-client/logs/latest.log ci-out/client-latest.log 2>/dev/null || true
          cd ci-out && git init -q && git checkout -q -b ci-client
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Client test output for run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})" || true
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-client || true
