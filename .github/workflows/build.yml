name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Compile and package
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "error:|warning: \[mixin\]|Mixin|FAILED" -A3 build.log | grep -vE "^\s*\^\s*$" | head -n 120 | cut -c1-400 > errors.txt || true
          grep -E "What went wrong" -A4 build.log | head -n 10 >> errors.txt || true
          split -l 8 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            echo "::error title=Build output::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$f")"
          done

      - name: Decompile reference classes
        if: contains(github.event.head_commit.message, '[probe]')
        run: |
          curl -sSL -o cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          MC=$(find ~/.gradle/caches/forge_gradle -name 'forge-1.16.5-36.2.39_mapped_official_1.16.5*.jar' | grep -v sources | head -1)
          echo "MC jar: $MC"
          mkdir -p decomp
          while read -r cls; do
            [ -z "$cls" ] && continue
            java -jar cfr.jar "$MC" --jarfilter "^${cls}\$" --outputdir decomp >/dev/null 2>&1 || true
          done < tools/probe-classes.txt
          find decomp -name '*.java' | head -100
          find ~/.gradle/caches -name '*enhancedcelestials*' | head

      - name: Upload decompiled classes
        if: contains(github.event.head_commit.message, '[probe]')
        uses: actions/upload-artifact@v4
        with:
          name: decomp
          path: decomp

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: ecmoons-jar
          path: build/libs/*.jar
          if-no-files-found: error
